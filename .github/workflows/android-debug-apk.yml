name: Build debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit test reply parser, sweep plan, and manual HEX parser
        run: |
          mkdir -p /tmp/zkc26-parser-tests
          javac -d /tmp/zkc26-parser-tests \
            app/src/main/java/au/example/zkc26ble/Reply30.java \
            app/src/main/java/au/example/zkc26ble/SweepPlan.java \
            app/src/main/java/au/example/zkc26ble/HexPacket.java \
            tests/Reply30Test.java tests/SweepPlanTest.java tests/HexPacketTest.java
          java -cp /tmp/zkc26-parser-tests au.example.zkc26ble.Reply30Test
          java -cp /tmp/zkc26-parser-tests au.example.zkc26ble.SweepPlanTest
          java -cp /tmp/zkc26-parser-tests au.example.zkc26ble.HexPacketTest
      - name: Build signed debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZKC26B-BLE-Probe-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error